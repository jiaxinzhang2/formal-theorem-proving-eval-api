name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      # The analysis layer runs on every attempt of every run, so a
      # complexity regression is silently expensive. tests/test_performance.py
      # holds the machine-independent scaling guarantees (ratio at n vs 4n);
      # this enforces the absolute budgets and prints the numbers into the
      # log so a slowdown is visible even when it stays under budget.
      - name: Metrics performance budgets
        run: python tests/measure_speed.py --check

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy || true   # advisory for now; not a merge gate

      # The mock backend exists so CI can exercise the real pipeline
      # without a Lean toolchain. --strict turns the demo fixtures'
      # deliberate `sorry` into a non-zero exit, so this asserts that
      # soundness screening still fires end to end.
      - name: Smoke test the pipeline
        run: |
          ftp-eval backends
          ftp-eval judges
          ftp-eval doctor -b mock --smoke
          # --strict must fail here: the fixtures contain a `sorry` proof.
          if ftp-eval verify -b mock \
               --tasks examples/jsonl-mode/tasks.jsonl \
               --attempts examples/jsonl-mode/attempts.jsonl \
               --out /tmp/results.jsonl --k 1,2 --strict --quiet; then
            echo "expected a non-zero exit: the fixtures contain reward hacking"
            exit 1
          fi
          ftp-eval score /tmp/results.jsonl --k 1,2 --tactics

      # Both links over the three-file layout. The fixtures include a
      # valid proof of an unfaithful statement, so eval-all must report
      # `proved_wrong_statement` rather than counting it as solved.
      - name: Smoke test statement checking and end-to-end
        run: |
          ftp-eval check-statement --judge mock --yes -b mock \
            --informal examples/jsonl-mode/triplet/informal.jsonl \
            --formal examples/jsonl-mode/triplet/formal.jsonl --quiet
          ftp-eval eval-all -b mock --judge mock --yes \
            --informal examples/jsonl-mode/triplet/informal.jsonl \
            --formal examples/jsonl-mode/triplet/formal.jsonl \
            --proofs examples/jsonl-mode/triplet/proof.jsonl \
            --out /tmp/combined.jsonl --quiet | tee /tmp/combined.txt
          grep -q "proved_wrong_statement" /tmp/combined.txt || {
            echo "expected the unfaithful-statement fixture to be caught"; exit 1; }

      # Two-file matching: does answer.lean prove theorem.lean? The
      # fixtures include an answer that compiles on its own but guts a
      # definition, so a clean exit here would mean the check is not working.
      - name: Smoke test theorem/answer matching
        run: |
          ftp-eval match examples/answer-verdicts/theorem.lean \
            examples/answer-verdicts/answer-good.lean \
            examples/answer-verdicts/answer-with-helpers.lean \
            examples/answer-verdicts/answer-unproved.lean | tee /tmp/match-ok.txt
          grep -q "verdict: statement_matches_unverified_proof" /tmp/match-ok.txt
          grep -q "matched_but_unproved" /tmp/match-ok.txt
          if ftp-eval match --strict examples/answer-verdicts/theorem.lean \
               examples/answer-verdicts/answer-gutted.lean \
               examples/answer-verdicts/answer-weakened.lean \
               examples/answer-verdicts/answer-smuggled.lean --quiet; then
            echo "expected a non-zero exit: these answers do not prove the theorem"
            exit 1
          fi

      # The contest pipeline: a benchmark folder of Lean problems, graded
      # for several participants. The fixtures include an answer that guts a
      # definition and one that leaves a cited helper unproved, so --strict
      # must exit non-zero.
      - name: Smoke test benchmark grading
        run: |
          ftp-eval grade \
            --problems benchmarks/demo-2026/problems \
            --submissions benchmarks/demo-2026/submissions \
            --out /tmp/grade-results --run-id ci --quiet | tee /tmp/grade.txt
          grep -q "stage 2 skipped" /tmp/grade.txt
          grep -q "carol/P099.lean" /tmp/grade.txt   # misfiled file reported
          grep -q "not verified" /tmp/grade.txt      # toolchain unverified
          for f in run.json problems.json problems.tsv leaderboard.tsv \
                   summary.json 1-match/all.jsonl 1-match/refused.jsonl \
                   2-compile/all.jsonl 3-report/by-problem.tsv; do
            test -f "/tmp/grade-results/ci/$f" || { echo "missing $f"; exit 1; }
          done
