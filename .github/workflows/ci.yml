name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy || true   # advisory for now; not a merge gate

      # The mock backend exists so CI can exercise the real pipeline
      # without a Lean toolchain. --strict turns the demo fixtures'
      # deliberate `sorry` into a non-zero exit, so this asserts that
      # soundness screening still fires end to end.
      - name: Smoke test the pipeline
        run: |
          ftp-eval backends
          ftp-eval doctor -b mock --smoke
          if ftp-eval verify -b mock \
               --tasks examples/tasks.jsonl \
               --attempts examples/attempts.jsonl \
               --out /tmp/results.jsonl --k 1,2 --strict --quiet; then
            echo "expected a non-zero exit: the fixtures contain an unsound proof"
            exit 1
          fi
          ftp-eval score /tmp/results.jsonl --k 1,2
