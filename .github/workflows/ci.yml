name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      # The analysis layer runs on every attempt of every run, so a
      # complexity regression is silently expensive. tests/analysis/test_performance.py
      # holds the machine-independent scaling guarantees (ratio at n vs 4n);
      # this enforces the absolute budgets and prints the numbers into the
      # log so a slowdown is visible even when it stays under budget.
      - name: Metrics performance budgets
        run: python scripts/measure_metrics_speed.py --check

      - name: Lint
        run: ruff check src tests scripts

      - name: Type check
        run: mypy

      # The mock backend exists so CI can exercise the real pipeline
      # without a Lean toolchain.
      - name: Smoke test the diagnostics
        run: |
          ftp-eval backends
          ftp-eval judges
          ftp-eval doctor -b mock --smoke

      # Auditing the problem set itself. Two regressions this guards:
      # a problem file's `sorry` is the hole a participant fills, and its
      # `variable` bindings are ordinary Lean, so neither may be reported
      # as a malformed statement -- screening a statement with the
      # proof-side rules marks every well-formed problem broken.
      - name: Smoke test problem-set auditing
        run: |
          mkdir -p /tmp/audit-problems
          printf '/-!\n- mathdb_id: ci\n- source: ci\n- prose: Prove True.\n-/\ntheorem P001 : True := by sorry\n' > /tmp/audit-problems/P001.lean
          ftp-eval audit --problems /tmp/audit-problems \
            --judge mock --yes --quiet | tee /tmp/audit.txt
          if grep -q "malformed" /tmp/audit.txt; then
            echo 'the demo problems are well formed: the sorry is the hole, not a cheat'
            exit 1
          fi
          # The audit fixture is fully sourced, so there is nothing to
          # report -- which is what makes the next check meaningful.
          if grep -q "no MathDB id" /tmp/audit.txt; then
            echo "the demo problems all record provenance; nothing should be reported"
            exit 1
          fi

          # A problem WITHOUT provenance must be reported rather than passed.
          mkdir -p /tmp/unsourced
          printf 'theorem P001 : True := by sorry\n' > /tmp/unsourced/P001.lean
          ftp-eval audit --problems /tmp/unsourced --quiet | tee /tmp/unsourced.txt
          grep -q "no MathDB id" /tmp/unsourced.txt
          grep -q "no .prose:. metadata" /tmp/unsourced.txt

          # A statement that assumes its own conclusion must still be caught.
          mkdir -p /tmp/bad-problems
          printf 'axiom cheat : True\ntheorem P001 : True := by sorry\n' \
            > /tmp/bad-problems/P001.lean
          if ftp-eval audit --problems /tmp/bad-problems --strict --quiet; then
            echo "expected a non-zero exit: the statement declares an axiom"
            exit 1
          fi

      - name: Smoke test frozen benchmark grading
        run: |
          ftp-eval grade --problems benchmarks/demo-2026/problems \
            --submissions benchmarks/demo-2026/submissions \
            --out /tmp/grade-results --run-id ci --quiet | tee /tmp/grade.txt
          grep -q "kernel checks not run" /tmp/grade.txt
          grep -q "carol/P099.lean" /tmp/grade.txt
          python - <<'PY'
          from pathlib import Path
          from ftp_eval.spec.stage import StageId
          root = Path('/tmp/grade-results/ci')
          expected = ['run.json', 'events.jsonl', 'problems.json', 'problems.tsv',
                      'leaderboard.tsv', 'summary.json',
                      StageId.ENVIRONMENT.directory + '/stage.json',
                      StageId.INTERFACE.directory + '/refused.jsonl',
                      StageId.REPORT.directory + '/by-problem.tsv']
          expected += [s.directory + '/all.jsonl' for s in StageId
                       if s not in (StageId.ENVIRONMENT, StageId.REPORT)]
          for name in expected:
              assert (root / name).is_file(), name
          PY
          if ftp-eval grade --problems benchmarks/demo-2026/problems \
               --submissions benchmarks/demo-2026/submissions --strict --quiet; then
            echo "unverified answers must never pass strict grading"
            exit 1
          fi
